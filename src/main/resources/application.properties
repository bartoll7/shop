spring.application.name=shop

# In-memory H2 so the project runs with no external setup.
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let JPA create the schema for now (we will revisit persistence in week 7).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console (handy for inspection).
spring.h2.console.enabled=true
